<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Roberto Stock Reel 預覽</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #0b0d10;
      color: #f7f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d10;
    }
    main {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: 0;
    }
    .meta {
      color: #aeb5bd;
      font-size: 13px;
      white-space: nowrap;
    }
    video {
      display: block;
      width: 100%;
      max-height: 72vh;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      background: #000;
      border: 1px solid #2c3239;
      border-radius: 6px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    a {
      display: flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 6px;
      background: #ffc64b;
      color: #101216;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
    }
    p {
      margin: 12px 2px 0;
      color: #aeb5bd;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI 供應鏈 Reel 預覽</h1>
      <span class="meta">48 秒 · 7.9 MB</span>
    </header>
    <video controls playsinline preload="metadata" poster="reels/roberto-stock-ai-supply-chain-preview-cover.jpg">
      <source src="reels/roberto-stock-ai-supply-chain-preview-mobile.mp4" type="video/mp4">
    </video>
    <div class="actions">
      <a href="reels/roberto-stock-ai-supply-chain-preview-mobile.mp4" download="roberto-stock-ai-supply-chain-preview.mp4">下載影片</a>
    </div>
    <p>iPhone 若開啟影片而未直接下載，請點分享按鈕，再選「儲存到檔案」或「儲存影片」。</p>
  </main>
</body>
</html>
